org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# The SDK declares kotlin-stdlib itself, at the old version of D5, so it never upgrades the app's
# stdlib.
kotlin.stdlib.default.dependency=false

# Maven coordinates are provisional until publishing is decided (D2, D8).
group=com.rubicon.analytics
# The single source of the SDK version (D9); generated into BuildInfo.VERSION.
version=0.1.0
