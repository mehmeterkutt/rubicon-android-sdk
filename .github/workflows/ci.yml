name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # ktlintCheck, test, apiCheck, lint, koverVerify, checkSourceRules and the build-logic tests.
      - run: ./gradlew check --stacktrace
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  okhttp5:
    name: sdk-android tests on OkHttp 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sdk-android:testDebugUnitTest -PokhttpTestMajor=5 --stacktrace
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: okhttp5-reports
          path: sdk-android/build/reports/
          retention-days: 7
